{% extends 'students/base.html' %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<div class="alert alert-danger mt-3" style="max-width: 500px;">
    <h5>Delete Student</h5>
    <p>Are you sure you want to delete <strong>{{ student.name }}</strong> ({{ student.roll_no }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
