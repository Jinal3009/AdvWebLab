<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Events Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { margin: 5px; padding: 10px; }
    #log { margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
    #summary { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>User Events Dashboard</h1>

  <div>
    <input type="text" id="username" placeholder="Username" />
    <input type="text" id="extra" placeholder="Extra info (item/field)" />
  </div>

  <div>
    <button onclick="emitEvent('user-login')">Login</button>
    <button onclick="emitEvent('user-logout')">Logout</button>
    <button onclick="emitEvent('user-purchase')">Purchase</button>
    <button onclick="emitEvent('profile-update')">Profile Update</button>
    <button onclick="getSummary()">Get Summary</button>
  </div>

  <div id="log"></div>
  <div id="summary"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const logDiv = document.getElementById('log');
    const summaryDiv = document.getElementById('summary');

    function emitEvent(type) {
      const username = document.getElementById('username').value || 'Anonymous';
      const extra = document.getElementById('extra').value || '';
      socket.emit('emit-event', { type, username, extra });
    }

    function getSummary() {
      socket.emit('get-summary');
    }

    socket.on('event', (msg) => {
      const p = document.createElement('p');
      p.textContent = msg;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    });

    socket.on('summary', (data) => {
      summaryDiv.innerHTML = '<h3>Event Summary</h3>';
      for (let key in data) {
        const p = document.createElement('p');
        p.textContent = `${key}: ${data[key]} times`;
        summaryDiv.appendChild(p);
      }
    });
  </script>
</body>
</html>
